name: Build ARMv7 Debug APK

on:
  push:
    branches:
      - dev

jobs:
  build-armv7-debug:
    name: Build ARMv7 (armeabi-v7a) Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build ARMv7 Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew :app:assembleDebug -PtargetAbi=armeabi-v7a --stacktrace
          else
            gradle :app:assembleDebug -PtargetAbi=armeabi-v7a --stacktrace
          fi

      - name: Upload ARMv7 Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youmusic-armeabi-v7a-debug
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
